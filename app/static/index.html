<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e5e7f0;
    --text: #12131a;
    --text-secondary: #62636f;
    --text-faint: #9496a3;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-tint: #eef0fe;
    --accent-ring: rgba(79, 70, 229, 0.25);
    --danger: #b3261e;
    --danger-bg: #fdf1f0;
    --danger-border: #f6d3d0;
    --radius-lg: 18px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(18, 19, 26, 0.04), 0 20px 40px -14px rgba(18, 19, 26, 0.16);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 12% 8%, rgba(79, 70, 229, 0.07), transparent 42%);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: #fff; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d3d5e2; border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #b7b9cc; }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem;
  }

  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 2.25rem 2.25rem 2rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: -0.01em;
    margin-bottom: 1.25rem;
  }
  .brand svg { flex-shrink: 0; }

  h1 {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0 0 0.4rem;
  }

  .subtitle {
    margin: 0 0 1.75rem;
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 34ch;
  }

  .field { margin-bottom: 1.25rem; }

  .field-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.4rem;
  }

  label {
    font-weight: 600;
    font-size: 0.85rem;
  }

  .counter {
    font-size: 0.75rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .counter.low { color: #b45309; }

  input, textarea {
    width: 100%;
    padding: 0.7rem 0.85rem;
    font: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    resize: none;
    transition: border-color 0.15s var(--ease-out-expo), box-shadow 0.15s var(--ease-out-expo);
  }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  input { caret-color: var(--accent); }
  textarea { caret-color: var(--accent); min-height: 5.5rem; line-height: 1.5; overflow: hidden; }

  input:hover, textarea:hover { border-color: #c7c9db; }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-ring);
  }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: none;
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.75rem 1rem;
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
  button[type="submit"]:active:not(:disabled) { transform: scale(0.985); }
  button[type="submit"]:focus-visible { box-shadow: 0 0 0 4px var(--accent-ring); }
  button[type="submit"]:disabled { background: #a5a0ec; cursor: default; }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .shake { animation: shake 0.3s var(--ease-out-expo); }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  #result {
    margin-top: 1.5rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s var(--ease-out-expo), transform 0.35s var(--ease-out-expo);
  }
  #result.visible { opacity: 1; transform: translateY(0); }
  #result:empty { margin-top: 0; }

  .panel {
    border-radius: var(--radius-md);
    padding: 1.1rem 1.2rem;
    border: 1px solid var(--border);
    background: #fafafd;
  }

  .panel.error {
    background: var(--danger-bg);
    border-color: var(--danger-border);
  }

  .result-head {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.85rem;
  }
  .result-head.error-head { color: var(--danger); }
  .result-head svg { flex-shrink: 0; }
  .result-head .ok-icon { color: #0a8a4a; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.9rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid var(--chip-bd, var(--border));
    background: var(--chip-bg, #f2f2f6);
    color: var(--chip-fg, var(--text-secondary));
  }
  .chip svg { color: var(--chip-fg, var(--text-secondary)); flex-shrink: 0; }

  .chip-resolver {
    --chip-bg: #ffffff;
    --chip-fg: var(--text);
    --chip-bd: var(--border);
  }

  .error-message {
    font-size: 0.88rem;
    color: #7a1f19;
    line-height: 1.5;
  }

  .retry-btn {
    margin-top: 0.75rem;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--danger);
    background: none;
    border: 1px solid var(--danger-border);
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .retry-btn:hover { background: #fbe4e2; }

  .similar-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    margin: 0.2rem 0 0.6rem;
  }

  .similar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }

  .similar-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.85rem;
  }

  .similar-subject {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .similar-meter {
    width: 4.5rem;
    height: 5px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .similar-meter > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
  }

  .similar-score {
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
    font-size: 0.78rem;
    width: 2.4rem;
    text-align: right;
    flex-shrink: 0;
  }

  .empty-note {
    font-size: 0.85rem;
    color: var(--text-faint);
  }

  @media (max-width: 420px) {
    .card { padding: 1.75rem 1.5rem; }
    h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <main class="card">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M9 3v4M15 3v4M4 9h16"/><rect x="4" y="4" width="16" height="16" rx="2.5"/></svg>
        Ticket Ops
      </div>
      <h1>Submit an IT ticket</h1>
      <p class="subtitle">Describe what's wrong — an AI classifier reads it and routes it to the right team.</p>

      <form id="ticket-form" novalidate>
        <div class="field">
          <div class="field-head">
            <label for="subject">Subject</label>
            <span class="counter" id="subject-counter">200</span>
          </div>
          <input id="subject" required maxlength="200" placeholder="e.g. VPN keeps dropping" autocomplete="off">
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" required rows="1" placeholder="What's happening, and when does it happen?"></textarea>
        </div>
        <button type="submit" id="submit-btn">
          <span id="submit-label">Submit ticket</span>
        </button>
      </form>

      <div id="result" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const ICONS = {
      network: '<path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M12 20h.01"/>',
      access: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      hardware: '<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20M9 19l1-3h4l1 3"/>',
      "productivity-apps": '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
      general: '<path d="M12 3v18M5 8l7-5 7 5M5 8v9l7 5 7-5V8"/>'
    };
    const ROUTE_ICON = '<path d="M5 12h13M13 6l6 6-6 6"/>';
    const CHECK_ICON = '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5"/>';
    const ALERT_ICON = '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>';

    function icon(paths, extra) {
      return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra || ""}>${paths}</svg>`;
    }

    const form = document.getElementById("ticket-form");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submit-btn");
    const submitLabel = document.getElementById("submit-label");
    const subjectInput = document.getElementById("subject");
    const descriptionInput = document.getElementById("description");
    const subjectCounter = document.getElementById("subject-counter");

    function updateCounter() {
      const remaining = 200 - subjectInput.value.length;
      subjectCounter.textContent = remaining;
      subjectCounter.classList.toggle("low", remaining <= 20);
    }
    subjectInput.addEventListener("input", updateCounter);
    updateCounter();

    function autosize() {
      descriptionInput.style.height = "auto";
      descriptionInput.style.height = descriptionInput.scrollHeight + "px";
    }
    descriptionInput.addEventListener("input", autosize);

    function showResult(html, { error = false } = {}) {
      result.classList.remove("visible");
      result.innerHTML = html;
      // force reflow so the transition replays on repeated submissions
      void result.offsetWidth;
      requestAnimationFrame(() => result.classList.add("visible"));
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitLabel.textContent = isLoading ? "Classifying…" : "Submit ticket";
      submitBtn.querySelector(".spinner")?.remove();
      if (isLoading) submitBtn.insertAdjacentHTML("afterbegin", '<span class="spinner"></span>');
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!form.checkValidity()) {
        form.classList.add("shake");
        setTimeout(() => form.classList.remove("shake"), 300);
        form.reportValidity();
        return;
      }

      const subject = subjectInput.value;
      const description = descriptionInput.value;
      setLoading(true);

      try {
        const res = await fetch("/tickets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject, description }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const detail = Array.isArray(err.detail)
            ? err.detail.map(d => d.msg).join(", ")
            : err.detail || res.statusText;
          throw new Error(detail);
        }
        const ticket = await res.json();

        let similarHtml = `<p class="empty-note">No similar tickets yet — this looks like the first of its kind.</p>`;
        const simRes = await fetch(`/tickets/${ticket.id}/similar`);
        if (simRes.ok) {
          const similar = await simRes.json();
          if (similar.length) {
            similarHtml = `
              <p class="similar-label">Similar tickets</p>
              <ul class="similar-list">
                ${similar.map(s => `
                  <li class="similar-item">
                    <span class="similar-subject" title="${s.subject.replace(/"/g, "&quot;")}">#${s.id} ${s.subject}</span>
                    <span class="similar-meter"><span style="width:${Math.round(s.score * 100)}%"></span></span>
                    <span class="similar-score">${Math.round(s.score * 100)}%</span>
                  </li>`).join("")}
              </ul>`;
          }
        }

        const catIcon = ICONS[ticket.category] || ICONS.general;
        showResult(`
          <div class="panel">
            <div class="result-head"><span class="ok-icon">${icon(CHECK_ICON)}</span> Ticket #${ticket.id} created</div>
            <div class="chips">
              <span class="chip" data-cat="${ticket.category}">${icon(catIcon)} ${ticket.category}</span>
              <span class="chip chip-resolver">${icon(ROUTE_ICON)} ${ticket.resolver}</span>
            </div>
            ${similarHtml}
          </div>
        `);
        form.reset();
        autosize();
        updateCounter();
      } catch (err) {
        showResult(`
          <div class="panel error">
            <div class="result-head error-head">${icon(ALERT_ICON)} Couldn't classify that ticket</div>
            <p class="error-message">${err.message}</p>
            <button type="button" class="retry-btn" id="retry-btn">Try again</button>
          </div>
        `, { error: true });
        document.getElementById("retry-btn")?.addEventListener("click", () => {
          result.classList.remove("visible");
          subjectInput.focus();
        });
      } finally {
        setLoading(false);
      }
    });
  </script>
  <style>
    .chip[data-cat="network"] { --chip-bg: #eff6ff; --chip-fg: #1d4ed8; --chip-bd: #bfdbfe; }
    .chip[data-cat="access"] { --chip-bg: #f5f3ff; --chip-fg: #6d28d9; --chip-bd: #ddd6fe; }
    .chip[data-cat="hardware"] { --chip-bg: #fffbeb; --chip-fg: #b45309; --chip-bd: #fde68a; }
    .chip[data-cat="productivity-apps"] { --chip-bg: #ecfdf5; --chip-fg: #047857; --chip-bd: #a7f3d0; }
    .chip[data-cat="general"] { --chip-bg: #f8fafc; --chip-fg: #475467; --chip-bd: #e2e8f0; }
  </style>
</body>
</html>
