name: Build and deploy on-premise

# Runs on every push to main: builds a Docker image, pushes it to GitHub Container Registry,
# then a self-hosted runner on your own machine pulls it and redeploys via docker compose.
# On-premise CI/CD, not a cloud PaaS "git push to deploy." To target a remote VM instead,
# swap the deploy job for an SSH step (appleboy/ssh-action) running the same commands.

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/dminish/opsticket/ticket-ops-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy on self-hosted runner
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'NEO4J_URI=bolt://neo4j:7687\nNEO4J_USER=neo4j\nNEO4J_PASSWORD=changeme_password\nOPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > .env
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull api
          docker compose up -d
          docker image prune -f
