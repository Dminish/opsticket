<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="615" viewBox="0 0 1040 615" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ticket Ops architecture</title>
<desc>Request path: a client calls FastAPI, which uses triage.py to classify the ticket with OpenAI, then graph_client.py writes it into Neo4j as a Ticket node linked to Category, Resolver and similar tickets. Delivery path: a push to main builds an image in GitHub Actions, publishes it to GHCR, and a self-hosted runner redeploys the Docker Compose stack.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444441"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1039" height="614" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<rect x="180" y="50" width="800" height="150" rx="10" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="196" y="72" font-size="12" fill="#5F5E5A">Docker Compose stack (api + neo4j)</text>

<rect x="20" y="93" width="140" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="90" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Client</text>
<text x="90" y="138" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Browser or curl</text>

<rect x="200" y="93" width="140" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="270" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">FastAPI</text>
<text x="270" y="138" text-anchor="middle" font-size="11.5" fill="#534AB7">Pydantic validation</text>

<rect x="380" y="93" width="140" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="450" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">triage.py</text>
<text x="450" y="133" text-anchor="middle" font-size="11.5" fill="#534AB7">LangChain structured</text>
<text x="450" y="147" text-anchor="middle" font-size="11.5" fill="#534AB7">output, fixed enum</text>

<rect x="560" y="93" width="140" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="630" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">graph_client.py</text>
<text x="630" y="138" text-anchor="middle" font-size="11.5" fill="#534AB7">Cypher over Bolt</text>

<rect x="760" y="93" width="180" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="850" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Neo4j 5</text>
<text x="850" y="138" text-anchor="middle" font-size="11.5" fill="#0F6E56">Graph database</text>

<line x1="160" y1="125" x2="200" y2="125" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="340" y1="125" x2="380" y2="125" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="520" y1="125" x2="560" y2="125" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="125" x2="760" y2="125" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="380" y="240" width="140" height="56" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="450" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">OpenAI API</text>
<text x="450" y="283" text-anchor="middle" font-size="11.5" fill="#993C1D">gpt-4o-mini</text>
<line x1="450" y1="157" x2="450" y2="240" stroke="#444441" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="462" y="224" font-size="11.5" fill="#5F5E5A">classify</text>

<line x1="850" y1="157" x2="850" y2="240" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="600" y="240" width="380" height="170" rx="10" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="616" y="262" font-size="12" fill="#0F6E56">Graph model</text>

<rect x="745" y="278" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="790" y="303" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Ticket</text>
<rect x="890" y="278" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-dasharray="4 3"/>
<text x="930" y="296" text-anchor="middle" font-size="11.5" fill="#0F6E56">Similar</text>
<text x="930" y="310" text-anchor="middle" font-size="11.5" fill="#0F6E56">ticket</text>
<line x1="835" y1="298" x2="890" y2="298" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<text x="862" y="268" text-anchor="middle" font-size="11" fill="#5F5E5A">SIMILAR_TO {score}</text>

<rect x="625" y="355" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="670" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Category</text>
<rect x="865" y="355" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="910" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Resolver</text>
<line x1="770" y1="318" x2="684" y2="355" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<text x="715" y="338" text-anchor="end" font-size="11" fill="#5F5E5A">BELONGS_TO</text>
<line x1="810" y1="318" x2="896" y2="355" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<text x="868" y="338" font-size="11" fill="#5F5E5A">ROUTED_TO</text>

<text x="30" y="484" font-size="12" fill="#5F5E5A">Delivery pipeline (GitHub Actions)</text>

<rect x="30" y="500" width="160" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="110" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Push to main</text>
<text x="110" y="545" text-anchor="middle" font-size="11.5" fill="#5F5E5A">git push</text>

<rect x="220" y="500" width="160" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="300" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Build job</text>
<text x="300" y="545" text-anchor="middle" font-size="11.5" fill="#534AB7">GitHub-hosted runner</text>

<rect x="410" y="500" width="160" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="490" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">GHCR image</text>
<text x="490" y="545" text-anchor="middle" font-size="11.5" fill="#0F6E56">Public package</text>

<rect x="600" y="500" width="160" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="680" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Self-hosted runner</text>
<text x="680" y="545" text-anchor="middle" font-size="11.5" fill="#534AB7">Your own machine</text>

<rect x="790" y="500" width="160" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="870" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Deploy</text>
<text x="870" y="545" text-anchor="middle" font-size="11.5" fill="#534AB7">docker compose up -d</text>

<line x1="190" y1="532" x2="220" y2="532" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="380" y1="532" x2="410" y2="532" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="570" y1="532" x2="600" y2="532" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="760" y1="532" x2="790" y2="532" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M950 532 H1010 V125 H982" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<text x="962" y="524" font-size="11.5" fill="#5F5E5A">deploys</text>

